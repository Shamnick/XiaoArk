name: 🐛 Bug 反馈
description: 报告一个问题 / Report a bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填全以下信息，这会显著加快修复速度。
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 你使用的 XiaoArk 版本号（关于页面可见）
      placeholder: 例如 0.9.4
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: 芯片架构 / Architecture
      options:
        - Apple Silicon (M 系列 / arm64)
        - Intel (amd64)
        - 不确定 / Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述 / What happened
      description: 你做了什么操作，期望看到什么，实际发生了什么
      placeholder: 步骤、期望、实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 如有相关日志请粘贴（注意遮盖订阅地址、节点 IP 等隐私信息）
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，没有重复反馈
          required: true
        - label: 日志和截图中已遮盖隐私信息（IP、订阅链接等）
          required: true
