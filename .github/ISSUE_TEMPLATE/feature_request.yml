name: ✨ 功能建议
description: 提议一个新功能或改进 / Suggest a feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem
      description: 描述你遇到的痛点或使用场景
      placeholder: 当我在……时，我希望……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你理想中的实现方式（可选）
    validations:
      required: false
